# Local development infrastructure for the Powerhouse 360 platform.
# Not for production — production runs on the Hostinger VPS via Coolify.
#   docker compose up -d      start postgres + mailpit + minio
#   docker compose down       stop (data persists in named volumes)
services:
  postgres:
    image: postgres:16-alpine
    container_name: ph360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ph360
      POSTGRES_PASSWORD: ph360_dev
      POSTGRES_DB: ph360
    ports:
      # Host 5433 to avoid clashing with other local Postgres stacks on 5432.
      - "5433:5432"
    volumes:
      - ph360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ph360 -d ph360"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches all outgoing mail in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: ph360-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # S3-compatible object storage for documents/photos. Console: http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: ph360-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ph360
      MINIO_ROOT_PASSWORD: ph360_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ph360_miniodata:/data

volumes:
  ph360_pgdata:
  ph360_miniodata:
